*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0a0b;font-family:'Paperozi','Suit',-apple-system,sans-serif;color:#f2f2f2;-webkit-user-select:none;user-select:none}
#stage canvas{display:block;cursor:grab;touch-action:none}
#stage canvas:active{cursor:grabbing}
.bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.logo{font-weight:700;letter-spacing:.14em;font-size:15px;color:#fff;text-decoration:none}
.logo small{font-weight:500;letter-spacing:.06em;color:#E5242B;margin-left:8px;font-size:11px}
#now{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:13px;font-weight:600;color:#fff;background:rgba(20,20,22,.78);backdrop-filter:blur(8px);padding:9px 16px;border-radius:999px;box-shadow:0 2px 12px rgba(0,0,0,.08);white-space:nowrap;max-width:70vw;overflow:hidden;text-overflow:ellipsis;z-index:4}
#idxbtn{background:#fff;color:#111;border:0;border-radius:999px;padding:9px 16px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer}
#idx{position:fixed;top:64px;right:22px;width:300px;max-height:calc(100vh - 140px);overflow:auto;background:rgba(18,18,20,.94);color:#eee;backdrop-filter:blur(10px);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.14);padding:10px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.2s;z-index:6;scrollbar-width:none}
#idx.open{opacity:1;transform:none;pointer-events:auto}
#idx ul{list-style:none}
#idx li{display:flex;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;cursor:pointer;line-height:1.35}
#idx li b{color:#999;font-weight:600;font-size:11px;padding-top:2px}
#idx li:hover{background:#26262a}
#idx li.cur{background:#fff;color:#111}#idx li.cur b{color:#E5242B}
#hint{position:fixed;left:22px;bottom:26px;font-size:11px;color:#8a8a8a;z-index:4;max-width:34vw}
.mv{position:fixed;right:22px;bottom:18px;display:none;flex-direction:column;gap:8px;z-index:4}
.mv button{width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#111;font-size:18px;touch-action:none}
@media (pointer:coarse){.mv{display:flex}#hint{bottom:auto;top:58px;left:22px;max-width:70vw}#now{bottom:28px;left:22px;transform:none;max-width:calc(100vw - 110px)}}
#intro{position:fixed;inset:0;background:#0a0a0b;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10;transition:opacity .6s}
#intro.off{opacity:0;pointer-events:none}
#intro h1{font-size:clamp(34px,6vw,64px);letter-spacing:.12em;font-weight:700}
#intro p{margin-top:14px;color:#9a9a9a;font-size:14px;line-height:1.6}
#count{margin-top:6px;font-size:12px;color:#777}
#enter{margin-top:28px;background:#fff;color:#111;border:0;border-radius:999px;padding:14px 34px;font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
#enter:disabled{opacity:.45;cursor:default}
.demo{position:absolute;top:22px;right:22px;font-size:11px;color:#E5242B;font-weight:600;letter-spacing:.08em}
#lb{position:fixed;inset:0;background:rgba(10,10,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:.25s;z-index:20;padding:24px}
#lb.on{opacity:1;pointer-events:auto}
#lbimg{max-width:min(92vw,1400px);max-height:72vh;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#lb .cap{color:#fff;text-align:center}
#lbt{font-size:17px;font-weight:600}
#lbm{font-size:12px;color:#aaa;margin-top:6px}
#lbgo{display:inline-block;margin-top:14px;background:#fff;color:#111;border-radius:999px;padding:10px 20px;font-size:13px;font-weight:600;text-decoration:none}
#lbx{position:absolute;top:18px;right:22px;background:none;border:0;color:#fff;font-size:28px;cursor:pointer;line-height:1}
.thm{display:flex;gap:2px;background:rgba(20,20,22,.78);backdrop-filter:blur(8px);border-radius:999px;padding:4px;position:absolute;left:50%;transform:translateX(-50%)}
.thm a{color:#aaa;text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.1em;padding:7px 13px;border-radius:999px}
.thm a.on{background:#fff;color:#111}
@media (max-width:600px){.thm{top:62px;left:22px;transform:none}.thm a{padding:6px 10px}}
