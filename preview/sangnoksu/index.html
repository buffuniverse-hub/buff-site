*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0c0c0d;color:#f3f3f3;font-family:'Paperozi','Suit',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* 상단 */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;height:60px;padding:0 24px;background:rgba(12,12,13,.86);backdrop-filter:blur(10px);border-bottom:1px solid #1f1f22}
.logo{font-weight:700;letter-spacing:.14em;font-size:15px;text-decoration:none}
.crumb{font-size:12px;letter-spacing:.12em;color:#8a8a8f}

/* 목록 */
#list{max-width:1240px;margin:0 auto;padding:40px 24px 80px}
.intro h1{font-size:clamp(28px,4vw,44px);letter-spacing:.06em;font-weight:700}
.intro p{margin-top:10px;color:#a3a3a8;font-size:15px;line-height:1.6}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 22px}
.filters button{padding:9px 16px;border-radius:999px;border:1px solid #2c2c30;font-size:13px;font-weight:600;color:#c9c9ce}
.filters button[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}
.cards{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{display:block;text-decoration:none;border-radius:14px;overflow:hidden;background:#151517;border:1px solid #1f1f22;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:#3a3a3f}
.card .ph{aspect-ratio:3/2;background:#1c1c1f;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .tx{padding:16px 18px 18px}
.card .sp{font-size:11px;font-weight:700;letter-spacing:.12em;color:#ff4d52}
.card h2{font-size:17px;font-weight:700;margin-top:6px;line-height:1.35}
.card .meta{font-size:12px;color:#8a8a8f;margin-top:6px;line-height:1.5}
.card .go{display:inline-block;margin-top:12px;font-size:12px;font-weight:600;color:#fff}
.status{padding:40px 0;color:#a3a3a8;font-size:14px}
.status button{margin-left:8px;text-decoration:underline}
.skel{border-radius:14px;background:linear-gradient(90deg,#151517,#1c1c1f,#151517);background-size:200% 100%;animation:sk 1.2s infinite;height:320px}
@keyframes sk{to{background-position:-200% 0}}

/* 전시실 */
#room{position:fixed;inset:0;z-index:20;background:#0c0c0d}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
.r-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:14px 16px;z-index:6;pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
.r-top>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;background:rgba(18,18,20,.82);backdrop-filter:blur(8px);font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.1)}
.pill.light{background:#fff;color:#111;border-color:#fff}
.r-title{flex:1;min-width:0;text-align:center}
.r-title b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-title span{display:block;font-size:11px;color:#b9b9be;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px;background:rgba(18,18,20,.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);max-width:calc(100vw - 24px)}
.r-bar .nav{width:44px;height:44px;border-radius:50%;background:#fff;color:#111;font-size:18px;flex:0 0 auto}
.r-bar .nav:disabled{opacity:.35;cursor:default}
.vp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 10px;min-width:150px}
.vp .nm{font-size:13px;font-weight:700;white-space:nowrap}
.dots{display:flex;gap:6px}
.dots button{width:22px;height:22px;display:grid;place-items:center}
.dots button::after{content:"";width:8px;height:8px;border-radius:50%;background:#55555a}
.dots button[aria-current=true]::after{background:#fff;width:10px;height:10px}
.dots button.ex::after{background:transparent;border:1.5px solid #8a8a8f}
.r-bar .tool{height:44px;padding:0 14px;border-radius:999px;font-size:12px;font-weight:600;color:#e6e6ea;flex:0 0 auto}
.r-bar .tool:hover{background:rgba(255,255,255,.08)}
.hint{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:3;background:rgba(255,255,255,.95);color:#111;font-size:13px;font-weight:600;padding:11px 18px;border-radius:12px;max-width:calc(100vw - 32px);text-align:center;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:opacity .4s}
.hint.off{opacity:0;pointer-events:none}
.r-loading{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:#0c0c0d center/cover no-repeat}
.r-loading::before{content:"";position:absolute;inset:0;background:rgba(10,10,11,.78);backdrop-filter:blur(6px)}
.r-loading>*{position:relative}
.r-loading h2{font-size:clamp(20px,3vw,28px)}
.r-loading p{color:#c4c4c9;font-size:14px}
.bar{width:180px;height:3px;border-radius:3px;background:#2a2a2e;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:#fff;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.fallback{position:absolute;inset:0;z-index:4;overflow:auto;padding:80px 20px 40px;background:#0c0c0d}
.fallback .msg{max-width:1100px;margin:0 auto 18px;color:#c4c4c9;font-size:14px}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid button{aspect-ratio:1;overflow:hidden;border-radius:6px;background:#1c1c1f;position:relative}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid button span{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:4px}

/* 사진 목록 시트 */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(8,8,9,.96);overflow:auto;padding:76px 20px 40px}
.sheet .hd{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(8,8,9,.96);z-index:1}
.sheet .hd b{font-size:15px}

/* 확대 보기 */
.lb{position:fixed;inset:0;z-index:40;background:rgba(6,6,7,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 16px 24px;touch-action:pan-y}
.lb figure{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%;max-height:100%}
.lb img{max-width:min(94vw,1600px);max-height:calc(100vh - 170px);object-fit:contain;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
.lb figcaption{text-align:center;font-size:13px;color:#c9c9ce;line-height:1.5}
.lb figcaption b{display:block;color:#fff;font-size:15px}
.lb .x{position:absolute;top:14px;right:16px}
.lb .lnav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);font-size:22px}
.lb .lnav:hover{background:rgba(255,255,255,.22)}
.lb .lnav.p{left:16px}.lb .lnav.n{right:16px}
.lb .open{font-size:12px;color:#fff;margin-top:4px;display:inline-block}

/* 도움말 */
.help{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.help .bx{background:#fff;color:#111;border-radius:16px;max-width:440px;width:100%;padding:24px}
.help h2{font-size:18px;margin-bottom:12px}
.help dl{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;font-size:13px;line-height:1.5}
.help dt{font-weight:700}
.help .ok{margin-top:18px;width:100%;height:44px;border-radius:999px;background:#111;color:#fff;font-weight:600}

@media (max-width:640px){
  .top{padding:0 16px}
  #list{padding:28px 16px 60px}
  .r-top{padding:10px}
  .pill{height:38px;padding:0 12px;font-size:12px}
  .r-bar{bottom:12px;gap:4px;padding:6px;width:calc(100vw - 16px);justify-content:space-between}
  .vp{min-width:0;flex:1;padding:0 4px}
  .r-bar .tool{padding:0 9px;font-size:11px}
  .r-bar .tool.home{display:none}
  .hint{bottom:86px}
  .lb .lnav{top:auto;bottom:22px;transform:none}
  .lb img{max-height:calc(100vh - 220px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="https://buffuniverse.co.kr/">BUFF</a><span class="crumb">GALLERY</span></header>

<main id="list" aria-labelledby="lt">
  <section class="intro">
    <h1 id="lt">BUFF GALLERY</h1>
    <p>BUFF가 기록한 사진 프로젝트를 실제 경기장처럼 꾸민 전시실에서 감상하세요.</p>
  </section>
  <nav class="filters" id="filters" aria-label="종목 필터"></nav>
  <ul class="cards" id="cards"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ul>
  <p class="status" id="lstatus" hidden></p>
</main>

<section id="room" hidden aria-label="전시실">
  <div id="stage"></div>
  <div class="r-top">
    <button class="pill light" id="toList">← 프로젝트 목록</button>
    <div class="r-title"><b id="rt"></b><span id="rs"></span></div>
    <button class="pill" id="helpBtn" aria-haspopup="dialog">도움말</button>
  </div>
  <div class="r-loading" id="rload">
    <h2 id="rlt"></h2>
    <p id="rlm">전시실을 준비하고 있어요</p>
    <div class="bar"><i></i></div>
    <button class="pill" id="rlphotos">사진 목록 바로 보기</button>
  </div>
  <div class="fallback" id="rfall" hidden>
    <p class="msg" id="rfmsg"></p>
    <div class="grid" id="rfgrid"></div>
  </div>
  <nav class="r-bar" id="rbar" aria-label="관람 지점" hidden>
    <button class="nav" id="vprev" aria-label="이전 관람 지점">←</button>
    <div class="vp"><span class="nm" id="vpname" aria-live="polite"></span><div class="dots" id="dots"></div></div>
    <button class="nav" id="vnext" aria-label="다음 관람 지점">→</button>
    <button class="tool home" id="vhome">처음 위치로</button>
    <button class="tool" id="photosBtn" aria-haspopup="dialog">사진 목록</button>
  </nav>
  <div class="hint off" id="hint" role="status"></div>
</section>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sht" hidden>
  <div class="hd"><b id="sht">사진 목록</b><button class="pill" id="shClose">닫기</button></div>
  <div class="grid" id="shgrid"></div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기" hidden>
  <button class="pill x" id="lbClose">닫기 ✕</button>
  <button class="lnav p" id="lbPrev" aria-label="이전 사진">←</button>
  <figure><img id="lbImg" alt=""><figcaption><b id="lbT"></b><span id="lbM"></span><br><a class="open" id="lbWork" href="#">프로젝트 페이지 보기 →</a></figcaption></figure>
  <button class="lnav n" id="lbNext" aria-label="다음 사진">→</button>
</div>

<div class="help" id="help" role="dialog" aria-modal="true" aria-labelledby="hlt" hidden>
  <div class="bx">
    <h2 id="hlt">관람 방법</h2>
    <dl id="hdl"></dl>
    <button class="ok" id="helpOk">확인</button>
  </div>
</div>

<script src="../../config.js"></script>
<script>
(async function () {
  try {
    const source = new URL("../../assets/arena3d.js", location.href);
    const response = await fetch(source);
    if (!response.ok) throw Error("3D bundle HTTP " + response.status);
    const sourceCode = await response.text();
    const assetBase = new URL("../../assets/arena/", location.href).href;
    if (!sourceCode.includes('bS="/assets/arena/"')) throw Error("Unrecognized arena bundle");
    const script = document.createElement("script");
    script.text = sourceCode.replace('bS="/assets/arena/"', "bS=" + JSON.stringify(assetBase));
    document.head.appendChild(script);
    if (!window.BuffArena) throw Error("Arena setup failed");
/* BUFF GALLERY — 목록 · 전시실 · 사진 보기 (3D는 전시실에 들어갈 때만 불러옴) */
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var MOBILE = matchMedia('(pointer:coarse)').matches;
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var SPORT = { basketball: '농구', tabletennis: '탁구', lacrosse: '라크로스', baseball: '야구', football: '축구', futsal: '풋살', flagfootball: '플래그풋볼', rugby: '럭비', other: '기타' };
  var SPORT_EN = { basketball: 'BASKETBALL', tabletennis: 'TABLE TENNIS', lacrosse: 'LACROSSE', baseball: 'BASEBALL', football: 'FOOTBALL', futsal: 'FUTSAL', flagfootball: 'FLAG FOOTBALL', rugby: 'RUGBY', other: 'SPORTS' };
  /* 프로젝트별 전시실(현장 구조 기준). 없으면 종목 기본값 → 기본 전시실 */
  var ROOMS = {
    'aubl-yonsei-vs-tsinghua': { scene: 'arena-sangnoksu', scoreboard: 'tsinghua' }, // 안산 상록수체육관
    'aubl-yonsei-vs-sjtu': { scene: 'arena-sangnoksu', scoreboard: 'screen' },
    'ilc-pro-table-tennis-league-2026-series4': 'tt-hall',
    'lacrosse-seoul-open-2026': 'field-lacrosse'
  };
  var BY_SPORT = { basketball: 'arena-basketball', tabletennis: 'tt-hall', lacrosse: 'field-lacrosse' };

  var data = null, filter = 'all', proj = null, ctl = null, lbIndex = -1, lastFocus = null, cameFromList = false;

  /* ───────── 데이터 ───────── */
  function load() {
    if (!window.sbGet) return Promise.reject(new Error('config'));
    return Promise.all([
      window.sbGet('works', 'select=title,slug,category,categories,sports,client,work_year,thumbnail_url,images&published=eq.true&order=sort_order.asc'),
      window.sbGet('team_members', 'select=avatar_url,photo_url').catch(function () { return []; })
    ]).then(function (res) {
      var people = {};
      res[1].forEach(function (t) { if (t.avatar_url) people[t.avatar_url] = 1; if (t.photo_url) people[t.photo_url] = 1; });
      data = res[0].filter(function (r) { return r.category === 'photo' || (r.categories || []).indexOf('photo') >= 0; }).map(function (r) {
        var seen = {}, photos = [];
        [r.thumbnail_url].concat(r.images || []).forEach(function (u) {
          if (!u || seen[u] || people[u] || /\.(mp4|mov|webm)(\?|$)/i.test(u)) return;
          seen[u] = 1; photos.push({ i: photos.length, src: u.indexOf('/assets/') === 0 ? '../..' + u : u });
        });
        var sport = (r.sports && r.sports[0]) || 'other';
        var room = ROOMS[r.slug]; if (typeof room === 'string') room = { scene: room };
        return { slug: r.slug, title: r.title, client: r.client, year: r.work_year, sport: sport, photos: photos, scene: (room && room.scene) || BY_SPORT[sport] || 'gallery', opts: room || {} };
      }).filter(function (p) { return p.photos.length; });
      return data;
    });
  }

  /* ───────── 목록 ───────── */
  function renderFilters() {
    var sports = [];
    data.forEach(function (p) { if (sports.indexOf(p.sport) < 0) sports.push(p.sport); });
    var nav = $('#filters'); nav.innerHTML = '';
    [['all', '전체']].concat(sports.map(function (s) { return [s, SPORT[s] || s]; })).forEach(function (f) {
      var b = document.createElement('button');
      b.textContent = f[1]; b.dataset.f = f[0]; b.setAttribute('aria-pressed', String(filter === f[0]));
      b.onclick = function () { filter = f[0]; history.replaceState(history.state, '', listUrl()); renderFilters(); renderCards(); };
      nav.appendChild(b);
    });
  }
  function renderCards() {
    var ul = $('#cards'); ul.innerHTML = '';
    data.filter(function (p) { return filter === 'all' || p.sport === filter; }).forEach(function (p) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'card'; a.href = '?p=' + encodeURIComponent(p.slug);
      a.innerHTML = '<div class="ph"><img loading="lazy" alt=""></div><div class="tx"><span class="sp"></span><h2></h2><p class="meta"></p><span class="go">전시실 입장 →</span></div>';
      a.querySelector('img').src = p.photos[0].src;
      a.querySelector('img').alt = p.title + ' 대표 사진';
      a.querySelector('.sp').textContent = (SPORT_EN[p.sport] || 'SPORTS') + ' · ' + (SPORT[p.sport] || '');
      a.querySelector('h2').textContent = p.title;
      a.querySelector('.meta').textContent = [p.client, p.year, '사진 ' + p.photos.length + '장'].filter(Boolean).join(' · ');
      a.onclick = function (e) { if (e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); saveListScroll(); cameFromList = true; history.pushState({ v: 'room' }, '', roomUrl(p.slug)); route(); };
      li.appendChild(a); ul.appendChild(li);
    });
  }
  function listUrl() { return location.pathname + (filter !== 'all' ? '?sport=' + filter : ''); }
  function roomUrl(slug, photo) { return location.pathname + '?p=' + encodeURIComponent(slug) + (photo != null ? '&photo=' + (photo + 1) : ''); }
  function saveListScroll() { try { sessionStorage.setItem('buffGalleryScroll', String(scrollY)); } catch (e) {} }
  function showList() {
    closeRoom();
    $('#list').hidden = false; $('.top').hidden = false;
    document.title = 'BUFF GALLERY';
    var q = new URLSearchParams(location.search);
    filter = q.get('sport') || 'all';
    if (data) { renderFilters(); renderCards(); }
    var y = 0; try { y = +sessionStorage.getItem('buffGalleryScroll') || 0; } catch (e) {}
    requestAnimationFrame(function () { scrollTo(0, y); });
  }

  /* ───────── 전시실 ───────── */
  var arenaScript = null;
  function loadArena() {
    if (window.BuffArena) return Promise.resolve();
    if (!arenaScript) arenaScript = new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = '/assets/arena3d.js?v=sangnoksu-v2'; s.async = true;
      s.onload = function () { window.BuffArena ? res() : rej(new Error('arena')); };
      s.onerror = function () { arenaScript = null; rej(new Error('arena')); };
      document.head.appendChild(s);
    });
    return arenaScript;
  }
  function webglOK() {
    try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) { return false; }
  }
  function openRoom(p) {
    if (proj && proj.slug === p.slug && (ctl || !$('#rfall').hidden || !$('#rload').hidden)) return; // 이미 열려 있음
    closeRoom();
    proj = p;
    $('#list').hidden = true; $('.top').hidden = true; $('#room').hidden = false;
    document.title = p.title + ' — BUFF GALLERY';
    $('#rt').textContent = p.title;
    $('#rs').textContent = [SPORT_EN[p.sport], p.client, p.year].filter(Boolean).join(' · ');
    $('#rlt').textContent = p.title;
    $('#rload').style.backgroundImage = 'url("' + p.photos[0].src.replace(/"/g, '%22') + '")';
    $('#rload').hidden = false; $('#rfall').hidden = true; $('#rbar').hidden = true;
    $('#rlm').textContent = '전시실을 준비하고 있어요';
    var token = p;
    if (!webglOK()) return fallback('이 기기에서는 3D 전시실을 열 수 없어 사진 목록으로 보여드려요.');
    var timer = setTimeout(function () { if (proj === token && !ctl) $('#rlm').textContent = '연결이 느려 시간이 걸리고 있어요. 사진 목록으로 먼저 보셔도 돼요.'; }, 8000);
    var hard = setTimeout(function () { if (proj === token && !ctl) fallback('3D 전시실을 불러오지 못해 사진 목록으로 보여드려요.'); }, 25000);
    loadArena().then(function () {
      if (proj !== token) return;
      try {
        ctl = window.BuffArena.mount($('#stage'), {
          sceneId: p.scene, project: { slug: p.slug, title: p.title, client: p.client, year: p.year, scoreboard: p.opts.scoreboard },
          photos: p.photos.map(function (x) { return { i: x.i, src: x.src }; }),
          reducedMotion: REDUCED,
          onPhoto: function (i) { var c = $('#stage canvas'); if (c) { c.tabIndex = -1; c.setAttribute('aria-label', '3D 전시실'); c.focus({ preventScroll: true }); } openPhoto(i, true); },
          onView: function (i, name, n) { updateBar(i, name); },
          onExit: function () { toList(); },
          onReady: function () {
            clearTimeout(timer); clearTimeout(hard);
            if (proj !== token) return;
            $('#rload').hidden = true; $('#rbar').hidden = false; buildDots(); showHint(false);
            var ph = new URLSearchParams(location.search).get('photo');
            if (ph) { history.replaceState({ v: 'room' }, '', roomUrl(p.slug)); openPhoto(+ph - 1, true); }
          }
        });
      } catch (e) { clearTimeout(timer); clearTimeout(hard); console.error(e); ctl = null; fallback('3D 전시실을 열지 못해 사진 목록으로 보여드려요.'); }
    }).catch(function () { clearTimeout(timer); clearTimeout(hard); if (proj === token) fallback('3D 전시실을 불러오지 못해 사진 목록으로 보여드려요.'); });
  }
  function fallback(msg) {
    if (ctl) { try { ctl.dispose(); } catch (e) {} ctl = null; }
    $('#rload').hidden = true; $('#rbar').hidden = true;
    $('#rfall').hidden = false; $('#rfmsg').textContent = msg;
    fillGrid($('#rfgrid'));
    var ph = new URLSearchParams(location.search).get('photo');
    if (ph) { history.replaceState({ v: 'room' }, '', roomUrl(proj.slug)); openPhoto(+ph - 1, true); }
  }
  function closeRoom() {
    if (ctl) { try { ctl.dispose(); } catch (e) {} ctl = null; }
    proj = null; $('#room').hidden = true; $('#stage').innerHTML = '';
    closeSheet(true); hideLB();
  }
  function toList() {
    if (cameFromList && history.state && history.state.v === 'room') { history.back(); return; }
    cameFromList = false;
    history.pushState({ v: 'list' }, '', listUrl()); route();
  }
  function buildDots() {
    var d = $('#dots'); d.innerHTML = '';
    ctl.viewpoints.forEach(function (v, i) {
      var b = document.createElement('button');
      b.setAttribute('aria-label', (i + 1) + '. ' + v.name + (v.exit ? ' (프로젝트 목록으로)' : ''));
      b.title = v.name; if (v.exit) b.className = 'ex';
      b.onclick = function () { ctl.go(i); };
      d.appendChild(b);
    });
    updateBar(ctl.current(), ctl.viewpoints[ctl.current()].name);
  }
  function updateBar(i, name) {
    if (!ctl) return;
    var n = ctl.viewpoints.length;
    $('#vpname').textContent = name + '  ' + (i + 1) + '/' + n;
    [].forEach.call($('#dots').children, function (b, k) { b.setAttribute('aria-current', String(k === i)); });
    $('#vprev').disabled = i === 0;
    var nxt = ctl.viewpoints[i + 1];
    $('#vnext').setAttribute('aria-label', nxt ? '다음 관람 지점: ' + nxt.name : '마지막 관람 지점');
    $('#vnext').disabled = !nxt;
  }
  $('#vprev').onclick = function () { ctl && ctl.prev(); };
  $('#vnext').onclick = function () { ctl && ctl.next(); };
  $('#vhome').onclick = function () { ctl && ctl.home(); };
  $('#toList').onclick = toList;
  $('#rlphotos').onclick = function () { openSheet(); };
  $('#photosBtn').onclick = function () { openSheet(); };

  /* ───────── 사진 목록 · 확대 ───────── */
  function fillGrid(el) {
    el.innerHTML = '';
    proj.photos.forEach(function (ph) {
      var b = document.createElement('button');
      b.setAttribute('aria-label', '사진 ' + (ph.i + 1) + ' 크게 보기');
      b.innerHTML = '<img loading="lazy" alt=""><span></span>';
      b.querySelector('img').src = ph.src; b.querySelector('span').textContent = ph.i + 1;
      b.onclick = function () { openPhoto(ph.i, true); };
      el.appendChild(b);
    });
  }
  function openSheet() {
    if (!proj) return;
    lastFocus = document.activeElement;
    fillGrid($('#shgrid')); $('#sheet').hidden = false; $('#shClose').focus();
  }
  function closeSheet(silent) { if ($('#sheet').hidden) return; $('#sheet').hidden = true; if (!silent && lastFocus) lastFocus.focus(); }
  $('#shClose').onclick = function () { closeSheet(); };

  var lbFocus = null;
  function openPhoto(i, push) {
    if (!proj) return;
    i = Math.max(0, Math.min(proj.photos.length - 1, i));
    if ($('#lb').hidden) lbFocus = document.activeElement;
    lbIndex = i;
    var ph = proj.photos[i], img = $('#lbImg');
    img.removeAttribute('src'); img.src = ph.src; img.alt = proj.title + ' 사진 ' + (i + 1);
    $('#lbT').textContent = proj.title;
    $('#lbM').textContent = [proj.client, proj.year, (i + 1) + ' / ' + proj.photos.length].filter(Boolean).join(' · ');
    $('#lbWork').href = '/work?' + proj.slug;
    $('#lbPrev').disabled = i === 0; $('#lbNext').disabled = i === proj.photos.length - 1;
    var wasOpen = !$('#lb').hidden;
    $('#lb').hidden = false;
    if (push && !wasOpen) history.pushState({ v: 'photo' }, '', roomUrl(proj.slug, i));
    else history.replaceState(history.state, '', roomUrl(proj.slug, i));
    $('#lbClose').focus();
  }
  function hideLB() { if ($('#lb').hidden) return false; $('#lb').hidden = true; lbIndex = -1; return true; }
  function closeLB() {
    if ($('#lb').hidden) return;
    if (history.state && history.state.v === 'photo') { history.back(); return; }
    hideLB(); history.replaceState(history.state, '', roomUrl(proj.slug));
    if (lbFocus && document.contains(lbFocus)) lbFocus.focus();
  }
  $('#lbClose').onclick = closeLB;
  $('#lbPrev').onclick = function () { openPhoto(lbIndex - 1, false); };
  $('#lbNext').onclick = function () { openPhoto(lbIndex + 1, false); };
  $('#lb').addEventListener('click', function (e) { if (e.target.id === 'lb') closeLB(); });
  (function () { // 스와이프
    var sx = null, sy = 0;
    $('#lb').addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; });
    $('#lb').addEventListener('pointerup', function (e) {
      if (sx == null) return;
      var dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) openPhoto(lbIndex + (dx < 0 ? 1 : -1), false);
    });
  })();
  addEventListener('keydown', function (e) {
    if (!$('#help').hidden) { if (e.key === 'Escape') closeHelp(); return; }
    if (!$('#lb').hidden) {
      if (e.key === 'Escape') closeLB();
      else if (e.key === 'ArrowRight') openPhoto(lbIndex + 1, false);
      else if (e.key === 'ArrowLeft') openPhoto(lbIndex - 1, false);
      return;
    }
    if (!$('#sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
    if (ctl && !$('#room').hidden && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
      if (e.key === 'ArrowRight' && document.activeElement === document.body) ctl.next();
      if (e.key === 'ArrowLeft' && document.activeElement === document.body) ctl.prev();
    }
  });

  /* ───────── 안내 ───────── */
  var HELP = MOBILE ? [
    ['둘러보기', '사진이 없는 곳을 한 손가락으로 드래그하세요.'],
    ['지점 이동', '바닥의 흰 원을 탭하거나 아래 ← → 버튼을 누르세요.'],
    ['사진 감상', '사진을 탭하면 크게 볼 수 있어요. 좌우로 밀어 넘기고, 닫기로 돌아와요.'],
    ['사진만 보기', '아래 ‘사진 목록’에서 전체 사진을 바로 열 수 있어요.']
  ] : [
    ['둘러보기', '빈 곳을 클릭한 채 드래그하세요.'],
    ['지점 이동', '바닥의 흰 원을 클릭하거나 아래 ← → 버튼을 누르세요.'],
    ['사진 감상', '사진을 클릭하면 크게 볼 수 있어요. 좌우 화살표로 넘기고, Esc로 닫아요.'],
    ['위치 찾기', '아래에 현재 지점이 표시되고, ‘처음 위치로’로 돌아갈 수 있어요.'],
    ['사진만 보기', '‘사진 목록’에서 전체 사진을 바로 열 수 있어요.']
  ];
  function showHint(force) {
    var key = 'buffArenaHint';
    try { if (!force && localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) {}
    var h = $('#hint');
    h.textContent = MOBILE ? '바닥의 흰 원을 탭해 이동하고, 사진을 탭하면 크게 볼 수 있어요.' : '바닥의 흰 원을 클릭해 이동하고, 드래그로 둘러보세요. 사진을 클릭하면 크게 볼 수 있어요.';
    h.classList.remove('off');
    var off = function () { h.classList.add('off'); $('#stage').removeEventListener('pointerdown', off); };
    setTimeout(off, 7000); $('#stage').addEventListener('pointerdown', off);
  }
  var helpFocus = null;
  $('#helpBtn').onclick = function () {
    helpFocus = document.activeElement;
    $('#hdl').innerHTML = '';
    HELP.forEach(function (r) { var dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = r[0]; dd.textContent = r[1]; $('#hdl').appendChild(dt); $('#hdl').appendChild(dd); });
    $('#help').hidden = false; $('#helpOk').focus();
  };
  function closeHelp() { $('#help').hidden = true; if (helpFocus) helpFocus.focus(); }
  $('#helpOk').onclick = closeHelp;
  $('#help').addEventListener('click', function (e) { if (e.target.id === 'help') closeHelp(); });

  /* ───────── 주소에 따라 화면 결정(뒤로 가기: 사진 → 전시실 → 목록) ───────── */
  function route() {
    var q = new URLSearchParams(location.search), slug = q.get('p');
    if (!data) return;
    if (!slug) { showList(); return; }
    var p = data.filter(function (x) { return x.slug === slug; })[0];
    if (!p) { history.replaceState({ v: 'list' }, '', location.pathname); showList(); return; }
    var ph = q.get('photo');
    if (proj && proj.slug === slug) {
      if (ph) openPhoto(+ph - 1, false);
      else if (hideLB() && lbFocus && document.contains(lbFocus)) lbFocus.focus();
      return;
    }
    openRoom(p);
  }
  addEventListener('popstate', route);

  function start() {
    $('#lstatus').hidden = true;
    load().then(function () {
      if (!data.length) { $('#cards').innerHTML = ''; $('#lstatus').hidden = false; $('#lstatus').textContent = '아직 공개된 사진 프로젝트가 없어요.'; return; }
      if (!history.state) {
        var q0 = new URLSearchParams(location.search);
        if (q0.get('p')) { // 공유 링크로 바로 들어와도 뒤로 가기 → 목록
          var here = location.href;
          history.replaceState({ v: 'list' }, '', location.pathname);
          history.pushState({ v: 'room' }, '', here); cameFromList = true;
        } else history.replaceState({ v: 'list' }, '', location.href);
      }
      route();
    }).catch(function () {
      $('#cards').innerHTML = '';
      var s = $('#lstatus'); s.hidden = false; s.textContent = '프로젝트를 불러오지 못했어요. 네트워크를 확인해 주세요.';
      var b = document.createElement('button'); b.textContent = '다시 시도'; b.onclick = start; s.appendChild(b);
    });
  }
  start();
})();


  } catch (error) {
    const status = document.querySelector("#lstatus");
    document.querySelector("#cards").replaceChildren();
    status.hidden = false;
    status.textContent = "3D 미리보기를 불러오지 못했습니다. 다시 열어 주세요.";
    console.error(error);
  }
})();
</script>
</body>
</html>
