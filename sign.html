.pg{font-family:CP,sans-serif;position:relative;flex:none;width:210mm;height:297mm;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.16);overflow:hidden;overflow-wrap:anywhere;padding:14mm 14mm 0 15mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.tight h1{font-size:28pt;margin:2mm 0 8mm}.tight .head{margin-bottom:6mm}.tight .intro{margin-bottom:6mm}.tight td,.tight th{padding:5px 9px;font-size:8.75pt}.cover .pb{display:flex;flex-direction:column}.cover .tw{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding-bottom:16mm}.cover table{flex:1 1 auto;height:100%}
.pg h3{font-size:10pt;margin:20pt 0 6pt}.pg .pb>section:first-child h3{margin-top:0}.pg section>p{margin:0 0 10px}
.sign-t{border-top:1px solid #d2d2d7;margin-top:26px;padding-top:14px}.pg .sign-t>p{font-size:13pt;font-weight:700;margin:0 0 16px}
.party{display:grid;grid-template-columns:minmax(0,1fr) 64mm;gap:8mm;align-items:end;padding:5mm 0;border-top:1px solid #e5e5ea}.party:first-child{border-top:0;padding-top:0}.party b{display:block;font-size:12pt;margin-bottom:8px}.pg .party p{font-size:10.5pt;line-height:1.6;margin:0 0 3px}
.sbox{position:relative;height:27mm;border:1px solid #1d1d1f;background:#fff}.sbox img{position:absolute;inset:3mm 3mm 7mm;width:calc(100% - 6mm);height:calc(100% - 10mm);object-fit:contain}.sbox .lab{position:absolute;right:6px;bottom:4px;font-size:8.5pt;color:#6e6e73}.sbox .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11pt;font-weight:700;color:#0071e3}.sbox [hidden]{display:none!important}.sbox.click{border:2px dashed #0071e3;background:#f2f8ff;cursor:pointer}.sbox.click:hover{background:#e6f1ff}.sbox.click.done{border:1px solid #1d1d1f;background:#fff}

.panel{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.mo>.panel{margin:auto 0}.mo .panel{width:100%;max-width:520px;margin:0}.panel h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input[type=text]{width:100%;padding:12px;border:1px solid #d2d2d7;border-radius:10px;font:inherit;font-size:16px}

.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:400;line-height:1.5}.chk input{margin-top:3px;width:18px;height:18px}
button{font:inherit;border:0;border-radius:12px;padding:13px 20px;background:#0a0a0a;color:#fff;font-weight:700;font-size:15px;cursor:pointer}button.line{background:#fff;color:#1d1d1f;border:1px solid #d2d2d7}button:disabled{opacity:.4}
.err{color:#d70015;font-size:14px;margin-top:10px;min-height:18px}.audit{font-size:12px;color:#6e6e73;line-height:1.6;word-break:break-all}

<body>
<header><img src="admin/vendor/logo_white.png" alt="BUFF UNIVERSE"><span>전자계약 서명</span></header>
<main id="m"><div class="msg">불러오는 중…</div></main>
<script src="config.js"></script>
<script>
(function(){
  var m=document.getElementById('m'),token=new URLSearchParams(location.search).get('t')||'';
  function e(t,txt,c){var n=document.createElement(t);if(txt!=null)n.textContent=txt;if(c)n.className=c;return n}
  function rpc(fn,body){var c=window.BUFF_CONFIG;return fetch(c.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message||'요청에 실패했습니다.');return j})})}
  function msg(t){m.replaceChildren(e('div',t,'msg'))}
  function fmt(d){return new Date(d).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false})}
  var live={img:null,name:null};
  function render(res){
    var s=res.snapshot,sheets=e('div',null,'sheets'),body;m.append(sheets);
    function brand(){var b=e('div',null,'brand'),im=e('img'),d=e('div');im.src='admin/vendor/logo_white.png';im.alt='BUFF';s.issuer.forEach(function(l,i){d.append(e('p',(i===0?'위탁자 · ':'')+l))});b.append(im,d);return b}
    function addPage(first){var pg=e('div',null,'pg'+(first?' cover':''));body=e('div',null,'pb');pg.append(body,brand());sheets.append(pg);return body}
    function place(n){body.append(n);if(body.children.length>1&&body.scrollHeight>body.clientHeight+1){n.remove();addPage();body.append(n)}}
    var h1=e('h1',s.title);h1.append(e('small',s.subtitle));
    var head=e('div',null,'head'),a=e('div'),b=e('div'),ph=e('p');ph.append(e('b','수행자 '),e('small','SERVICE PROVIDER'));a.append(ph);
    s.partnerDetails.forEach(function(l){a.append(e('p',l))});
    s.details.forEach(function(d){var p=e('p');p.append(e('b',d[0]+' '),e('small',d[1]));b.append(p,e('p',d[2],'m'))});
    head.append(a,b);
    var tw=e('div',null,'tw'),t=e('table'),tb=e('tbody'),hr=e('tr'),th=e('thead');hr.append(e('th','항목'),e('th','작업확인서'));th.append(hr);
    s.rows.forEach(function(r){var tr=e('tr');var td=e('td');String(r[1]).split(/(\u27E6[^\u27E7]*\u27E7)/).forEach(function(part){if(!part)return;if(part.charAt(0)==='\u27E6'){var mk=document.createElement('mark');mk.textContent=part.slice(1,-1);td.append(mk)}else td.append(document.createTextNode(part))});tr.append(e('th',r[0]),td);tb.append(tr)});t.append(th,tb);tw.append(t);
    addPage(true);body.append(h1,head,e('p',s.intro,'intro'),tw);
    var cp=body.parentNode,spilled=false;
    function over(){return body.scrollHeight>body.clientHeight+1}
    if(over())cp.classList.add('tight');
    if(over()){
      spilled=true;cp.classList.remove('cover','tight');tw.remove();
      var thead=t.tHead,rws=[].slice.call(t.tBodies[0].rows);
      var chunk=function(){var c=e('table'),tb2=e('tbody');c.append(thead.cloneNode(true),tb2);c.style.margin='0 0 14px';body.append(c);return tb2};
      var tb3=chunk();
      rws.forEach(function(r){tb3.append(r);if(tb3.rows.length>1&&over()){r.remove();addPage();tb3=chunk();tb3.append(r)}});
    }
    if(!spilled)addPage();
    s.clauses.forEach(function(c){var sec=e('section');sec.append(e('h3',c[0]),e('p',c[1]));place(sec)});
    var sg=e('div',null,'sign-t');sg.append(e('p',s.signature[0]));
    var ps=e('div',null,'parties');
    var mine=res.role==='issuer'?0:1;
    s.signParties.forEach(function(p,i){
      var row=e('div',null,'party'),info=e('div');info.append(e('b',p.role));p.lines.forEach(function(l){info.append(e('p',l))});
      var box=e('div',null,'sbox'),lab=e('span',null,'lab'),im=e('img');im.alt='서명';im.hidden=true;box.append(im);
      var sig=i===mine?res.signature:(i===0?res.issuer_signature:null),nm=i===mine?res.signer_name:res.issuer_name,at=i===mine?res.signed_at:res.issuer_signed_at;
      if(sig){im.src=sig;im.hidden=false;lab.textContent='서명: '+nm+(at?' · '+fmt(at):'')}
      else if(i===mine){live.img=im;live.box=box;live.lab=lab;box.classList.add('click');lab.textContent='(서명 또는 날인)';var hint=e('span','✍ 여기를 눌러 서명','hint');box.append(hint);live.hint=hint}
      else lab.textContent='(서명 또는 날인)';
      if(i===mine&&sig){live.img=im;live.box=box;live.lab=lab}
      box.append(lab);row.append(info,box);ps.append(row);
    });
    sg.append(ps);place(sg);
    return sheets;
  }
  function fit(){
    var avail=document.documentElement.clientWidth-24,k=Math.min(1,avail/(210*96/25.4));
    [].forEach.call(document.querySelectorAll('.pg'),function(p){p.style.zoom=k});
  }
  window.addEventListener('resize',fit);
  function pad(){
    var c=e('canvas'),ctx,drawing=false,has=false,last;
    function size(){var r=c.getBoundingClientRect(),k=window.devicePixelRatio||1;c.width=r.width*k;c.height=r.height*k;ctx=c.getContext('2d');ctx.scale(k,k);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0a0a0a';has=false}
    function pos(ev){var r=c.getBoundingClientRect();return[ev.clientX-r.left,ev.clientY-r.top]}
    c.addEventListener('pointerdown',function(ev){ev.preventDefault();drawing=true;last=pos(ev);c.setPointerCapture(ev.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],1.2,0,7);ctx.fill();has=true;c.dispatchEvent(new Event('ink'))});
    c.addEventListener('pointermove',function(ev){if(!drawing)return;ev.preventDefault();var p=pos(ev);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;c.dispatchEvent(new Event('ink'))});
    ['pointerup','pointercancel'].forEach(function(n){c.addEventListener(n,function(){drawing=false})});
    return {el:c,init:size,clear:function(){size();c.dispatchEvent(new Event('ink'))},has:function(){return has},data:function(){return c.toDataURL('image/png')}};
  }
  function form(res){
    var p=e('div',null,'panel noprint'),agree=e('input'),go=e('button','서명 완료'),err=e('div',null,'err'),st={name:'',data:''};
    agree.type='checkbox';
    p.append(e('h2','서명하기'),e('p','계약서 아래쪽 파란 점선 칸을 눌러 서명해 주세요.'));
    var lab=e('label',null,'chk');lab.append(agree,e('span','위 계약서의 내용을 모두 확인했으며, 이 전자서명이 직접 서명한 것과 동일한 효력을 가짐에 동의합니다.'));p.append(lab,go,err);
    function check(){go.disabled=!(st.name&&st.data&&agree.checked)}
    agree.addEventListener('change',check);check();
    function openModal(){
      var mo=e('div',null,'mo'),pn=e('div',null,'panel'),sp=pad(),name=e('input'),ok=e('button','확인'),cancel=e('button','취소','line'),clr=e('button','다시 쓰기','line');
      name.type='text';name.placeholder='성함';name.autocomplete='name';name.value=st.name||(res.role==='issuer'?'김동준':'');
      ok.type=cancel.type=clr.type='button';
      pn.append(e('h2','서명'),e('label','서명자 성함'),name,e('label','아래 칸에 손가락이나 마우스로 서명해 주세요'),sp.el);
      var row=e('div',null,'row');row.append(clr,cancel,ok);pn.append(row);mo.append(pn);document.body.append(mo);document.body.style.overflow='hidden';sp.init();name.enterKeyHint='done';name.addEventListener('keydown',function(k){if(k.key==='Enter'){k.preventDefault();name.blur()}});
      function chk(){ok.disabled=!(name.value.trim()&&sp.has())}
      [name,sp.el].forEach(function(x){x.addEventListener('input',chk);x.addEventListener('ink',chk)});chk();
      clr.onclick=sp.clear;var rs=function(){if(!sp.has())sp.init()};if(window.visualViewport)visualViewport.addEventListener('resize',rs);function shut(){mo.remove();document.body.style.overflow='';if(window.visualViewport)visualViewport.removeEventListener('resize',rs)}cancel.onclick=shut;
      ok.onclick=function(){
        st.name=name.value.trim();st.data=sp.data();shut();
        live.img.src=st.data;live.img.hidden=false;live.lab.textContent='서명: '+st.name;
        if(live.hint)live.hint.hidden=true;live.box.classList.add('done');check();
      };
    }
    live.box.onclick=openModal;
    go.onclick=function(){
      go.disabled=true;err.textContent='';
      rpc('submit_signing',{p_token:token,p_name:st.name,p_signature:st.data,p_agent:navigator.userAgent}).then(function(){load()})
        .catch(function(x){err.textContent=x.message;go.disabled=false});
    };
    return {el:p,init:function(){}};
  }
  function sealPage(sr){
    m.replaceChildren();document.title='BUFF 대표 날인';
    if(sr.status==='signed')return msg('이미 날인이 완료된 링크입니다. 감사합니다.');
    if(sr.status!=='sent')return msg('기한이 지난 링크입니다. BUFF 담당자에게 새 링크를 요청해 주세요.');
    var p=e('div',null,'panel'),sp=pad(),name=e('input'),agree=e('input'),go=e('button','날인 등록'),err=e('div',null,'err'),clr=e('button','다시 쓰기','line');
    name.type='text';name.value='김동준';agree.type='checkbox';clr.type='button';
    p.append(e('h2','대표 날인 등록'),e('p','버프유니버스(BUFF UNIVERSE) 위탁자(갑) 서명·날인으로 등록됩니다. 앞으로 발송되는 계약서의 갑 칸에 이 서명이 표시돼요.'),e('label','성함'),name,e('label','아래 칸에 서명해 주세요'),sp.el);
    var row=e('div',null,'row');row.append(clr);p.append(row);
    var lab=e('label',null,'chk');lab.append(agree,e('span','위 서명을 BUFF UNIVERSE 대표자의 전자 서명·날인으로 사용하는 데 동의합니다.'));p.append(lab,go,err);
    m.append(p);sp.init();
    function chk(){go.disabled=!(name.value.trim()&&sp.has()&&agree.checked)}
    [name,sp.el].forEach(function(x){x.addEventListener('input',chk);x.addEventListener('ink',chk)});agree.addEventListener('change',chk);chk();
    clr.onclick=function(){sp.clear();chk()};
    go.onclick=function(){go.disabled=true;rpc('submit_seal',{p_token:token,p_name:name.value.trim(),p_signature:sp.data()}).then(function(){msg('날인이 등록되었습니다. 감사합니다.')}).catch(function(x){err.textContent=x.message;go.disabled=false})};
  }
  function load(){
    if(!token)return msg('올바르지 않은 서명 링크입니다.');
    rpc('get_signing',{p_token:token}).then(function(res){
      if(!res)return rpc('get_seal_request',{p_token:token}).then(function(sr){if(!sr)return msg('서명 링크를 찾을 수 없습니다.');sealPage(sr)});
      if(res.status==='canceled')return msg('이 링크는 더 이상 사용할 수 없어요. 이미 다른 링크로 서명이 끝났거나 내용이 수정된 계약서일 수 있어요. 필요하면 BUFF 담당자에게 문의해 주세요.');
      if(res.status==='expired')return msg('서명 기한이 지났어요. BUFF 담당자에게 새 링크를 요청해 주세요.');
      m.replaceChildren();
      document.title='BUFF 전자계약 · '+(res.snapshot.project||'');
      var f=null;
      if(res.status==='signed'){
        var ok=e('div','서명 완료 · '+fmt(res.signed_at)+' · '+res.signer_name,'ok');ok.classList.add('noprint');m.append(ok);
      }
      m.append(render(res));fit();
      if(res.status==='signed'){
        var pr=e('button','인쇄 · PDF 저장','line');pr.className='line noprint';pr.onclick=function(){window.print()};m.append(pr);
        m.append(e('p','문서 지문(SHA-256) '+res.doc_hash,'audit noprint'));
      }else{f=form(res);m.append(f.el);f.init();fit();m.append(e('p','문서 지문(SHA-256) '+res.doc_hash,'audit noprint'))}
    }).catch(function(x){msg(x.message)});
  }
  load();
})();
</script>
