name: Work link previews
# 작품별 링크 미리보기 페이지(/work/<slug>)를 다시 만듭니다.
on:
  push:
    branches: [main]
    paths-ignore: ['work/**', 'en/work/**']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [works-changed]
permissions:
  contents: write
concurrency:
  group: work-previews
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-og.mjs
      - name: Commit if changed
        run: |
          git config user.name "buff-previews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A work en/work
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update work link previews"
          git pull --rebase origin main
          git push origin HEAD:main
